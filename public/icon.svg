<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Heart and Hands/Bridge Motif -->
  <g transform="translate(106, 106)" fill="white">
    <!-- Heart shape (representing Care) -->
    <path d="M150 70 C100 0, 10 10, 10 100 C10 170, 90 230, 150 280 C210 230, 290 170, 290 100 C290 10, 200 0, 150 70 Z" opacity="0.15"/>
    <!-- Bridge / Caring Hands line drawing -->
    <path d="M40 220 C100 140, 200 140, 260 220" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/>
    <circle cx="150" cy="110" r="40" />
    <path d="M90 250 C90 200, 210 200, 210 250" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
